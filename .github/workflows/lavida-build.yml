name: Build Lavida candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lavida-candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'lavidade/paperless-ngx'
    runs-on: ubuntu-latest
    environment: image-publishing
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse candidate overwrite
        env:
          CANDIDATE: ghcr.io/lavidade/paperless-ngx:candidate-${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$CANDIDATE"; then
            printf '%s\n' 'Refusing to overwrite existing candidate' >&2
            exit 1
          fi
      - name: Build and push exact source commit
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lavidade/paperless-ngx:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=3.3.4-lavida.1
            org.opencontainers.image.source=https://github.com/lavidade/paperless-ngx
          provenance: mode=max
      - name: Read back published index
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "ghcr.io/lavidade/paperless-ngx@$DIGEST"
          printf 'Candidate index: `%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
