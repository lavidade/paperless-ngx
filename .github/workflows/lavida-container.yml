name: Lavida container

on:
  push:
    branches: ['release/**']
    tags: ['v*-lavida.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lavida-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Build and publish Lavida image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select version and prevent overwriting a release
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=$(python3 - <<'PY'
          import ast
          tree = ast.parse(open('src/paperless/version.py').read())
          version = next(n.value for n in tree.body if isinstance(n, ast.AnnAssign) and getattr(n.target, 'id', '') == '__version__')
          print('.'.join(map(str, ast.literal_eval(version))))
          PY
          )
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^${upstream//./\.}-lavida\.[0-9]+$ ]] || { echo 'Release tag must match source version'; exit 1; }
          else
            version="${upstream}-lavida-build.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${GITHUB_SHA:0:12}"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing image tag
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /tmp/existing 2>/tmp/inspect-error; then
            echo 'Tag already exists; choose a new release number.'
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/inspect-error; then
            cat /tmp/inspect-error
            exit 1
          fi
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=lavida-2.7
          cache-to: type=gha,mode=max,scope=lavida-2.7
      - name: Verify publication
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION" | tee /tmp/published
          grep -F "$DIGEST" /tmp/published
          printf '## Published image\n`%s:%s`\n\nDigest: `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release after successful publication
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf 'Paperless Lavida build from commit `%s`.\n\nImage: `%s:%s`\n\nDigest: `%s`\n\nContains the Lavida ASN customization. A rebuild is not identical to the historical image. Deployment requires separate validation.\n' "$GITHUB_SHA" "$IMAGE" "$VERSION" "$DIGEST" > /tmp/release-notes
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Paperless $VERSION" --notes-file /tmp/release-notes --latest=false
