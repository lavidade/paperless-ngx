name: Lavida ASN candidates (not production)
on:
  push:
    branches: [migration/asn-v3, release/2.20-lavida]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lavida-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: lavida_synthetic
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      PAPERLESS_SECRET_KEY: synthetic-ci-only-not-production
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: localhost
      PAPERLESS_DBUSER: runner
      PAPERLESS_DBNAME: lavida_synthetic
      PAPERLESS_DISABLE_DBHANDLER: 'true'
      PAPERLESS_CACHE_BACKEND: django.core.cache.backends.locmem.LocMemCache
      PAPERLESS_DATA_DIR: /tmp/lavida-data
      PAPERLESS_MEDIA_ROOT: /tmp/lavida-media
      PAPERLESS_CONSUMPTION_DIR: /tmp/lavida-consume
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      - run: |
          if [ "$GITHUB_REF_NAME" = 'release/2.20-lavida' ]; then PY=3.12; else PY=3.14; fi
          uv sync --frozen --group testing --python "$PY"
          uv pip install --python .venv/bin/python 'psycopg[binary]'
          mkdir -p /tmp/lavida-data /tmp/lavida-media /tmp/lavida-consume
          .venv/bin/python src/manage.py makemigrations --check --dry-run
          .venv/bin/pytest -o addopts='' src/documents/tests/test_lavida_asn*.py -q
          .venv/bin/pytest -o addopts='' src/documents/tests/test_consumer.py -k 'Asn or asn' -q
          .venv/bin/python scripts/test_lavida_asn.py
  candidate:
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            release/2.20-lavida) VERSION=2.20.15 ;;
            migration/asn-v3) VERSION=3.3.3 ;;
            *) exit 1 ;;
          esac
          printf 'tag=ghcr.io/lavidade/paperless-ngx:%s-lavida-asn-candidate-%s-%s\n' "$VERSION" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/lavidade/paperless-ngx
            org.opencontainers.image.revision=${{ github.sha }}
            io.lavida.candidate=true
          cache-from: type=gha,scope=lavida-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=lavida-${{ github.ref_name }}
